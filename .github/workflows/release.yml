name: Release

# 打 tag 就自动构建并发布 Release：
#   git tag v2.1.0 && git push origin v2.1.0
#
# 也可以在 Actions 页面手动触发（workflow_dispatch）。手动触发不创建 Release，
# 只把 APK 传成 workflow artifact，方便先单独验证构建能不能过。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # runner 在海外，直连 google()/mavenCentral() 更快更稳。
      # 开着阿里云镜像反而可能超时 —— Gradle 是「仓库里找不到才换下一个」，
      # 超时不会自动降级，所以这里必须显式关掉镜像。
      WAITLEISURE_NO_CN_MIRRORS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉完整历史：versionCode 取的是 git rev-list --count HEAD，
          # 默认的 fetch-depth: 1 会让它恒等于 1，版本号就废了。
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ---------------------------------------------------------------------
      # 恢复正式签名用的 keystore
      #
      # 为什么必须有这一步：GitHub Actions 每次都在全新的虚拟机上跑，
      # AGP 会**重新生成**一个 ~/.android/debug.keystore —— 于是每个 Release
      # 的签名都不一样，用户装更新时报
      #   INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # 只能卸载重装，白名单 / 定时 / 任务全部重配。
      #
      # 所以签名密钥必须固定，而且**不能进仓库**（仓库是公开的）。
      #
      # 只要**一个** Secret：RELEASE_KEYSTORE，格式是一行三段的
      #     <keystore 的 base64>|<口令>|<别名>
      #
      # 为什么打包成一个而不是分四个 Secret：分四个要人肉填四遍，
      # 实测第一版就把 base64 粘进了「口令」那一栏（pwd_len=3696），
      # 而 CI 只报一句「Build release APK 失败」，查了半天。
      # 一个值、粘一次，没有粘错的机会。
      # ---------------------------------------------------------------------
      - name: Restore release keystore
        env:
          BUNDLE: ${{ secrets.RELEASE_KEYSTORE }}
          B64_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PWD_SECRET: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS_SECRET: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # 两种配法都支持：
          #   A. 单个 RELEASE_KEYSTORE = <base64>|<口令>|<别名>
          #   B. 四个分开的 Secret（base64 / 口令 / 别名 / 密钥口令）
          # A 优先。B 是兼容旧配法 —— 它有个已知的坑：base64 有 3696 字符、
          # 口令只有 24 字符，都是乱码，粘贴时串行了肉眼看不出来。
          if [ -n "$BUNDLE" ]; then
            KEYSTORE_B64="${BUNDLE%%|*}"
            REST="${BUNDLE#*|}"
            STORE_PASSWORD="${REST%%|*}"
            KEY_ALIAS="${REST#*|}"
            echo "使用单个 RELEASE_KEYSTORE（${#BUNDLE} 字符）"
            if [ "$KEYSTORE_B64" = "$BUNDLE" ] || [ "$REST" = "$BUNDLE" ]; then
              echo "::error::RELEASE_KEYSTORE 格式不对 —— 需要 <base64>|<口令>|<别名> 三段。bundle_len=${#BUNDLE}"
              exit 1
            fi
          elif [ -n "$B64_SECRET" ]; then
            KEYSTORE_B64="$B64_SECRET"
            STORE_PASSWORD="$PWD_SECRET"
            KEY_ALIAS="${ALIAS_SECRET:-waitleisure}"
            echo "使用四个分开的 Secret"
          else
            echo "::error::没有配签名密钥 —— 建 RELEASE_KEYSTORE，或 RELEASE_KEYSTORE_BASE64 等四个"
            exit 1
          fi

          # 口令不该长到离谱 —— 那说明把 base64 粘到口令那一栏了。
          # 这一条就是上一轮定位到的故障（pwd_len=3696）。
          if [ "${#STORE_PASSWORD}" -gt 200 ]; then
            echo "::error::口令字段有 ${#STORE_PASSWORD} 个字符，太长了 —— 多半把 base64 粘到口令那一栏了。"
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$HOME/.android/waitleisure-release.jks"
          KS="$HOME/.android/waitleisure-release.jks"
          SIZE=$(stat -c%s "$KS")
          SHA=$(sha256sum "$KS" | cut -c1-16)
          echo "keystore: ${SIZE} bytes, sha256=$SHA"

          # 就地验口令。失败时把**关键事实写进 ::error::** ——
          # 普通 echo 只能去网页看日志，而 ::error:: 会变成 check-run 注解，
          # 用 API 就能读到，排查不用来回问人。
          INFO="size=${SIZE} sha256=${SHA} pwd_len=${#STORE_PASSWORD} alias=[${KEY_ALIAS}] b64_len=${#KEYSTORE_B64}"

          if keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "keystore 口令与 alias 校验通过（$INFO）"
          elif keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            REAL=$(keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" 2>/dev/null | grep -i 'PrivateKeyEntry' | head -1 | sed 's/,.*//')
            echo "::error::keystore 口令正确，但 alias 不对。$INFO 实际 alias=[${REAL}]"
            exit 1
          else
            echo "::error::keystore 口令不对（或文件解码后已损坏）。$INFO 期望 size=2770"
            exit 1
          fi

          # 供后面的构建步骤使用
          echo "WAITLEISURE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WAITLEISURE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WAITLEISURE_KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        # keystore 的路径不用给：build.gradle.kts 默认就找
        # ${user.home}/.android/waitleisure-release.jks，runner 上正好是
        # 上一步解出来的那个位置。
        # 口令和 alias 由上一步写进 $GITHUB_ENV，不需要再单独配 Secret。
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 兜底：万一 keystore 没生效、悄悄退回 debug 签名，这里直接失败，
      # 而不是把一个用户装不上的包发出去。
      - name: Verify signature is not the debug key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'DN:|SHA-256 digest' || true
          DN=$("$APKSIGNER" verify --print-certs "$APK" | grep 'certificate DN' | head -1)
          if echo "$DN" | grep -q 'CN=Android Debug'; then
            echo "::error::签出来的是 debug key，不是正式 keystore —— 用户会装不上更新"
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Read version from APK metadata
        id: ver
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          echo "--- output-metadata.json ---"
          cat "$META"
          CODE=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionCode'])")
          NAME=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionName'])")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE  versionName=$NAME"

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WaitLeisure-${{ steps.ver.outputs.name }}.apk"
          ls -lh out/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaitLeisure-apk
          path: out/*.apk

      - name: Write release notes
        run: |
          {
            echo "自动构建自 tag \`${GITHUB_REF_NAME}\`。"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 应用 | 等闲 · WaitLeisure |"
            echo "| 包名 | \`com.waitleisure\` |"
            echo "| versionCode | \`${{ steps.ver.outputs.code }}\` |"
            echo "| versionName | \`${{ steps.ver.outputs.name }}\` |"
            echo "| 签名 | debug（仅供自用/侧载，请勿上架商店） |"
            echo
            echo "### 安装"
            echo
            echo '```bash'
            echo "adb install -r WaitLeisure-*.apk"
            echo '```'
            echo
            echo "> **换了包名**：从 \`com.selflock\` 改成 \`com.waitleisure\`。"
            echo "> 这是一个全新的 App，旧的 SelfLock 不会自动升级/卸载，请手动卸载；"
            echo "> 旧的配置（白名单、定时规则、分组、任务）也不会带过来，需要重配一次。"
            echo
            echo "首次使用请照 README「第一次使用：照这个顺序做」一节把权限配齐。"
            echo "小米 / 红米（HyperOS）特别注意 **「后台弹出界面」**，不授权锁机页拉不起来。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.apk \
            --title "等闲 WaitLeisure ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
